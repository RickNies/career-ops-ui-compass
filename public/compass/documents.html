<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mango Jobs</title>
  <link rel="icon" href="/compass/img/mascot.svg">
<style>
  :root{
    --bg:#F6F3EC; --surface:#FFFFFF; --surface-2:#FBF9F4;
    --ink:#16324F; --ink-soft:#3A4A5A; --muted:#6B7480;
    --line:#E7E1D5; --line-soft:#F0ECE2;
    --gold:#B4894C; --gold-deep:#96702F; --gold-soft:#F4EBD9;
    --sage:#2F6F5B; --sage-soft:#E4EFE9;
    --terra:#B5623B; --terra-soft:#F6E7DE;
    --blue:#2E5C8A; --blue-soft:#E4EDF6;
    --shadow:0 1px 2px rgba(22,50,79,.04), 0 8px 24px rgba(22,50,79,.06);
    --shadow-sm:0 1px 2px rgba(22,50,79,.06);
    --radius:14px; --radius-sm:10px;
    --ring:var(--gold);
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  h1,h2,h3{font-family:var(--serif);font-weight:600;letter-spacing:-.01em;margin:0}
  button{font-family:inherit;cursor:pointer}

  /* ===== Iteration 5 — shared interaction kit (accessibility + consistency) ===== */
  :focus-visible{outline:2px solid var(--ring);outline-offset:2px}
  :focus:not(:focus-visible){outline:none}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;font-family:inherit;font-weight:600;font-size:13.5px;line-height:1.2;border-radius:999px;border:1px solid transparent;padding:9px 15px;cursor:pointer;text-decoration:none;white-space:nowrap;transition:background .12s ease,border-color .12s ease,color .12s ease,transform .08s ease}
  .btn svg{width:15px;height:15px;flex:none}
  .btn:disabled{opacity:.6;cursor:default}
  .btn--primary{background:var(--ink);color:#fff;border-color:var(--ink);box-shadow:var(--shadow-sm)}
  .btn--primary:hover{background:#0f2740}
  .btn--outline{background:var(--surface);color:var(--ink-soft);border-color:var(--line);box-shadow:var(--shadow-sm)}
  .btn--outline:hover{border-color:var(--gold);color:var(--gold-deep)}
  .btn--ghost{background:transparent;border-color:transparent;color:var(--ink-soft)}
  .btn--ghost:hover{background:var(--line-soft)}
  .btn--sage{background:var(--sage);color:#fff;border-color:var(--sage)}
  .btn--sage:hover{background:#255a49}
  .btn--terra{background:var(--terra);color:#fff;border-color:var(--terra)}
  .btn--terra:hover{background:#9c5231}
  .btn--sm{padding:8px 14px;font-size:13px}
  .btn--icon{padding:0;width:38px;height:38px}
  .regen svg{color:var(--gold-deep)}
  .badge{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;line-height:1.4;border-radius:999px;padding:3px 11px;border:1px solid transparent}
  .badge svg{width:12px;height:12px;flex:none}
  .badge .tk{width:6px;height:6px;border-radius:999px;flex:none}
  .badge--cat{background:var(--gold-soft);color:var(--gold-deep)} .badge--cat .tk{background:var(--gold)}
  .badge--func{background:var(--blue-soft);color:var(--blue)} .badge--func .tk{background:var(--blue)}
  .badge--lvl{background:var(--sage-soft);color:var(--sage)} .badge--lvl .tk{background:var(--sage)}
  .badge--warm{background:var(--sage-soft);color:var(--sage)}
  .badge--cool{background:var(--gold-soft);color:var(--gold-deep)}
  .badge--outline{background:var(--line-soft);color:var(--ink-soft)}
  .badge--live{background:var(--sage-soft);color:var(--sage)} .badge--live .tk{background:var(--sage)}
  /* shared toast (role=status / aria-live announces completions) */
  .toast-wrap{position:fixed;z-index:120;left:50%;bottom:24px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
  .toast{display:inline-flex;align-items:center;gap:9px;background:var(--ink);color:#fff;border-radius:999px;padding:11px 18px;font-size:13.5px;font-weight:600;box-shadow:0 10px 30px rgba(22,50,79,.25);pointer-events:auto;max-width:92vw;animation:toastin .2s ease}
  .toast svg{width:16px;height:16px;flex:none}
  .toast--success{background:var(--sage)} .toast--info{background:var(--ink)} .toast--error{background:var(--terra)}
  @keyframes toastin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @media(prefers-reduced-motion:reduce){ .toast,.btn{animation:none;transition:none} }

  .topbar{position:sticky;top:0;z-index:20;background:rgba(246,243,236,.85);backdrop-filter:saturate(180%) blur(10px);border-bottom:1px solid var(--line)}
  .topbar-in{max-width:960px;margin:0 auto;display:flex;align-items:center;gap:28px;padding:14px 22px}
  .brand{display:flex;align-items:center;gap:9px;font-family:var(--serif);font-size:19px;font-weight:600}
  .brand svg{color:var(--gold)}
  .nav{display:flex;gap:6px;margin-left:6px}
  .nav a{padding:8px 14px;border-radius:999px;color:var(--ink-soft);font-weight:500;font-size:14.5px}
  .nav a:hover{background:var(--line-soft)}
  .nav a.active{background:var(--ink);color:#fff}
  .spacer{flex:1}
  .gear{width:34px;height:34px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--ink-soft);display:grid;place-items:center;margin-right:2px}
  .gear:hover{border-color:var(--gold);color:var(--gold-deep)}
  .gear svg{width:17px;height:17px}
  .avatar{width:34px;height:34px;border-radius:999px;background:var(--gold-soft);color:var(--gold-deep);display:grid;place-items:center;font-weight:600;font-size:13px;border:1px solid var(--line)}

  .wrap{max-width:960px;margin:0 auto;padding:24px 22px 70px}
  .context{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm);padding:14px 18px;margin-bottom:18px}
  .context .ic{flex:none;width:40px;height:40px;border-radius:10px;background:var(--gold-soft);color:var(--gold-deep);display:grid;place-items:center}
  .context .t{font-family:var(--serif);font-size:16px;font-weight:600}
  .context .d{color:var(--muted);font-size:13px;margin-top:2px}
  .context a.change{margin-left:auto;color:var(--gold-deep);font-weight:600;font-size:13.5px}

  /* tabs */
  .tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:22px}
  .tab{padding:11px 16px;font-size:14.5px;font-weight:600;color:var(--muted);border:0;background:transparent;border-bottom:2.5px solid transparent;margin-bottom:-1px;display:inline-flex;align-items:center;gap:8px}
  .tab svg{width:16px;height:16px}
  .tab:hover{color:var(--ink)}
  .tab.active{color:var(--ink);border-bottom-color:var(--gold)}

  h1.sr{position:absolute;left:-9999px}

  /* ---- Match to resume ---- */
  .match-top{display:flex;align-items:center;gap:18px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px;margin-bottom:16px}
  .match-top .ring{flex:none;width:84px;height:84px;border-radius:999px;background:var(--sage-soft);border:2.5px solid #B9D8CB;color:var(--sage);display:grid;place-items:center;font-family:var(--serif);font-size:30px;font-weight:600}
  .match-top h2{font-size:20px}
  .match-top .d{color:var(--muted);font-size:14px;margin-top:5px;max-width:52ch}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
  .panel h3{font-size:16px;display:flex;align-items:center;gap:9px;margin-bottom:14px}
  .panel h3 .b{width:24px;height:24px;border-radius:999px;display:grid;place-items:center}
  .panel h3 .b svg{width:14px;height:14px}
  .b-yes{background:var(--sage-soft);color:var(--sage)}
  .b-gap{background:var(--terra-soft);color:var(--terra)}
  .plist{list-style:none;margin:0;padding:0}
  .plist li{display:flex;gap:10px;padding:9px 0;font-size:14px;color:var(--ink-soft);border-bottom:1px solid var(--line-soft)}
  .plist li:last-child{border-bottom:0}
  .plist li .m{flex:none;margin-top:2px}
  .plist .m.yes{color:var(--sage)} .plist .m.gap{color:var(--terra)}
  .tip{background:var(--surface-2);border:1px solid var(--line-soft);border-radius:var(--radius-sm);padding:9px 12px;margin-top:12px;font-size:13px;color:var(--muted)}
  .tip b{color:var(--ink-soft)}

  /* ---- generated doc ---- */
  .doc-toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .doc-toolbar .lead{color:var(--muted);font-size:13.5px}
  .doc-toolbar .right{margin-left:auto;display:flex;gap:8px}
  .letter{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:38px 44px;font-family:var(--serif);font-size:15.5px;line-height:1.75;color:#20303e}
  .letter p{margin:0 0 15px}
  .letter .sig{margin-top:26px}
  .email-head{border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:18px;font-family:var(--sans)}
  .email-head .fld{display:flex;gap:10px;font-size:13.5px;margin-bottom:6px}
  .email-head .fld .k{color:var(--muted);width:64px;flex:none}
  .email-head .fld .v{color:var(--ink);font-weight:500}
  .hl{background:var(--sage-soft);border-radius:3px;padding:0 3px}

  /* ---- Iteration 6: Tailor your résumé ---- */
  .tailor-intro{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px;margin-bottom:16px}
  .tailor-intro .ic{flex:none;width:44px;height:44px;border-radius:11px;background:var(--gold-soft);color:var(--gold-deep);display:grid;place-items:center}
  .tailor-intro .ic svg{width:22px;height:22px}
  .tailor-intro h2{font-size:18px}
  .tailor-intro .d{color:var(--muted);font-size:13.5px;margin-top:3px;max-width:60ch}
  .resume-sheet{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:34px 40px;color:#20303e}
  .resume-sheet .rs-name{font-family:var(--serif);font-size:24px;font-weight:600;color:var(--ink)}
  .resume-sheet .rs-contact{color:var(--muted);font-size:13px;margin-top:4px}
  .resume-sheet .rs-tag{display:inline-flex;align-items:center;gap:8px;background:var(--gold-soft);color:var(--gold-deep);border-radius:8px;padding:7px 12px;font-size:12.5px;font-weight:600;margin:14px 0 6px}
  .resume-sheet .rs-tag svg{width:14px;height:14px}
  .resume-sheet h3{font-family:var(--serif);font-size:14px;letter-spacing:.02em;text-transform:uppercase;color:var(--ink);border-bottom:1px solid var(--line);padding-bottom:6px;margin:22px 0 12px}
  .resume-sheet .rs-role{font-weight:600;color:var(--ink);font-size:14.5px}
  .resume-sheet .rs-where{color:var(--muted);font-size:13px;margin-bottom:8px}
  .resume-sheet ul{margin:0 0 6px;padding-left:20px}
  .resume-sheet li{margin-bottom:8px;font-size:14px;line-height:1.6}
  .skillset{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:4px}
  .adjust{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-top:16px}
  .adjust h3{font-size:16px;display:flex;align-items:center;gap:9px;margin-bottom:6px}
  .adjust h3 .b{width:24px;height:24px;border-radius:999px;background:var(--gold-soft);color:var(--gold-deep);display:grid;place-items:center}
  .adjust h3 .b svg{width:14px;height:14px}
  .adjust .lead{color:var(--muted);font-size:13.5px;margin-bottom:14px}
  .ba{border:1px solid var(--line-soft);border-radius:var(--radius-sm);padding:13px 15px;margin-bottom:11px;background:var(--surface-2)}
  .ba:last-child{margin-bottom:0}
  .ba .ba-line{display:flex;gap:10px;font-size:14px;line-height:1.55}
  .ba .ba-line + .ba-line{margin-top:8px}
  .ba .ba-k{flex:none;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;width:52px;padding-top:2px}
  .ba .ba-k.before{color:var(--muted)}
  .ba .ba-k.after{color:var(--sage)}
  .ba .ba-before{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
  .ba .ba-after{color:var(--ink-soft)}

  @media(max-width:760px){
    .two{grid-template-columns:1fr}
    .brand span{display:none}
    .letter{padding:26px 22px}
    .tabs{overflow-x:auto}
  }
</style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-in">
      <a href="dashboard.html" class="brand" style="text-decoration:none;color:var(--ink)">
        <img src="/compass/img/mascot.svg" alt="Mango Jobs" width="26" height="26">
        <span>Mango Jobs</span>
      </a>
      <nav class="nav">
        <a href="dashboard.html">Dashboard</a>
        <a href="jobs.html">Jobs</a>
        <a href="saved.html">My Jobs</a>
        <a class="active" href="documents.html">Tailoring</a>
      </nav>
      <div class="spacer"></div>
      <a class="gear" href="setup.html" title="Setup &amp; preferences" aria-label="Setup"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 13a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-2.9-1.2l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0-1.2-2.9H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.2-2.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 2.9 1.2l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg></a>
      <div class="avatar" title="Nicole Doan, CPA">ND</div>
    </div>
  </header>

  <main class="wrap">
    <h1 class="sr">Tailoring</h1>
    <!-- Header is replaced live by js/wire.js (buildTailoringHeader) with a real
         tracker job picker. No demo job/résumé filename in the source. -->
    <div class="context">
      <div class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 3h9l5 5v13H6z"/><path d="M14 3v6h6"/></svg></div>
      <div>
        <div class="t">Pick a job to tailor for</div>
        <div class="d">Working from your résumé. Search your tracker to choose which job to tailor for.</div>
      </div>
      <a class="change" href="jobs.html">Change job</a>
    </div>

    <div class="tabs" role="tablist" aria-label="Documents">
      <button class="tab active" id="tabTailor" role="tab" aria-selected="true" aria-controls="panelTailor" tabindex="0"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h9M4 12h6"/><path d="M15 5l4 4-7 7-4 1 1-4z"/></svg>Tailor your résumé</button>
      <button class="tab" id="tabCover" role="tab" aria-selected="false" aria-controls="panelCover" tabindex="-1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v16H4z"/><path d="M8 9h8M8 13h6"/></svg>Cover letter</button>
    </div>

    <!-- ============ TAILOR YOUR RÉSUMÉ ============
         LIVE DATA — js/wire.js (setupTailorPanel) replaces this panel with the
         real tailoring flow (POST /api/cv-studio/tailor via the background job
         queue), rendering actual versions from your real résumé + the picked
         job. No demo résumé/contact info ships in the source. -->
    <section id="panelTailor" role="tabpanel" aria-labelledby="tabTailor" tabindex="0">
      <div class="doc-loading" style="color:#8a8172;font:14px system-ui;padding:26px 4px">Pick a job above, then tailor your résumé for it.</div>
    </section>

    <!-- ============ COVER LETTER ============
         LIVE DATA — js/wire.js (setupDocPanel) replaces this panel with the real
         cover-letter generator (POST /api/mode/cover via the background job
         queue). No demo letter/contact info in the source. -->
    <section id="panelCover" role="tabpanel" aria-labelledby="tabCover" tabindex="0" hidden>
      <div class="doc-loading" style="color:#8a8172;font:14px system-ui;padding:26px 4px">Pick a job above, then generate a cover letter for it.</div>
    </section>

  </main>

  <!-- shared toast: screen-reader announced, non-blocking -->
  <div id="toastLive" class="toast-wrap" role="status" aria-live="polite" aria-atomic="false"></div>

<script>
/* ===== Iteration 5 shared kit: toast ===== */
function toast(msg, type){
  var w=document.getElementById("toastLive"); if(!w) return;
  var t=document.createElement("div"); t.className="toast toast--"+(type||"info");
  if(type==="success"){ t.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg>'; }
  var s=document.createElement("span"); s.textContent=msg; t.appendChild(s);
  w.appendChild(t);
  setTimeout(function(){ t.style.transition="opacity .2s"; t.style.opacity="0"; setTimeout(function(){ if(t.parentNode) t.remove(); }, 220); }, 3600);
}

/* ===== Iteration 5: real ARIA tabs (roving tabindex + arrow/Home/End keys, panel switching) ===== */
function initTabs(tablist, opts){
  opts=opts||{};
  var tabs=Array.prototype.slice.call(tablist.querySelectorAll('[role="tab"]'));
  function select(tab, focus){
    tabs.forEach(function(t){
      var on=t===tab;
      t.setAttribute("aria-selected", on?"true":"false");
      t.tabIndex = on?0:-1;
      if(opts.onClass) t.classList.toggle(opts.onClass, on);
      if(opts.panels){ var p=document.getElementById(t.getAttribute("aria-controls")); if(p) p.hidden=!on; }
    });
    if(focus) tab.focus();
    if(opts.onSelect) opts.onSelect(tab);
  }
  tablist.addEventListener("keydown", function(e){
    var i=tabs.indexOf(document.activeElement); if(i<0) return;
    var n;
    if(e.key==="ArrowRight"||e.key==="ArrowDown") n=(i+1)%tabs.length;
    else if(e.key==="ArrowLeft"||e.key==="ArrowUp") n=(i-1+tabs.length)%tabs.length;
    else if(e.key==="Home") n=0;
    else if(e.key==="End") n=tabs.length-1;
    else return;
    e.preventDefault(); select(tabs[n], true);
  });
  tabs.forEach(function(t){ t.addEventListener("click", function(){ select(t, false); }); });
  return {select:select, tabs:tabs};
}
var docTabs = initTabs(document.querySelector(".tabs"), {onClass:"active", panels:true});

/* ===== Iteration 6: Tailor your résumé — PDF export (mock) + redo + deep-link ===== */
var pdfBtn=document.getElementById("tailorPdf");
if(pdfBtn){
  pdfBtn.addEventListener("click", function(){ toast("Your tailored résumé PDF is ready", "success"); });
}
var tailorRewrite=document.getElementById("tailorRewrite");
if(tailorRewrite){
  tailorRewrite.addEventListener("click", function(){ toast("Résumé re-tailored for this job", "info"); });
}
/* open the Tailor tab when arriving from job-detail's "Tailor your résumé for this job" link */
function openTabFromHash(){
  var map={"#tailor":"tabTailor","#cover":"tabCover"};
  var id=map[location.hash];
  if(id){ var t=document.getElementById(id); if(t) docTabs.select(t, false); }
}
openTabFromHash();
window.addEventListener("hashchange", openTabFromHash);
</script>
  <script src="js/wire.js"></script>
</body>
